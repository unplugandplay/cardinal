name: Cardinal

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cardinal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cardinal:
    name: harness checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.12"
      - name: Build the Nim CLI
        run: nim c -d:release --hints:off -o:nim/bin/cardinal-nim nim/cardinal.nim
      - name: Check the managed copies, the settings entries and the review gate
        run: nim/bin/cardinal-nim check